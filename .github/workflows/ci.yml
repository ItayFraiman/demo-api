name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
    lint-and-test:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          node-versions: [18,20]

      steps:
        - uses: actions/checkout@v4

        - name: Use Node.js ${{ matrix.node-versions }}
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.node-versions }}
            cache: npm 
        - run: npm ci
        - run: npm run lint
        - run: npm test
    
    build-and-push:
      needs: lint-and-test
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      permissions:
        contents: read
        packages: write

      steps:
        - uses: docker/setup-buildx-action@v3
        - uses: actions/checkout@v4
        - name: Lowercase owner
          id: owner
          run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

        - uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - uses: docker/build-push-action@v6
          with:
            push: true
            tags: |
              ghcr.io/${{ steps.owner.outputs.name }}/demo-api:${{ github.sha }}
              ghcr.io/${{ steps.owner.outputs.name }}/demo-api:latest


  